<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bentake2 — Dev workspace</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #1c1917;
        color: #fafaf9;
      }
      body {
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1.5rem;
        line-height: 1.6;
      }
      h1 {
        color: #0891b2;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        border: none;
        border-radius: 0.5rem;
        background: #0891b2;
        color: #fff;
        cursor: pointer;
      }
      #out {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 0.5rem;
        background: #292524;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript dev workspace</h1>
    <p>
      This repo powers your Cloud Agent environment. Use it to practice JavaScript
      on the path toward game development and QA.
    </p>
    <label for="name">Your name</label>
    <input id="name" type="text" value="Benjamin" />
    <br />
    <button id="go" type="button">Greet</button>
    <p id="out" aria-live="polite"></p>
    <script type="module">
      import { greet } from './greet.js';

      const name = document.getElementById('name');
      const out = document.getElementById('out');
      document.getElementById('go').addEventListener('click', () => {
        try {
          out.textContent = greet(name.value);
        } catch (err) {
          out.textContent = err.message;
        }
      });
      out.textContent = greet(name.value);
    </script>
  </body>
</html>
